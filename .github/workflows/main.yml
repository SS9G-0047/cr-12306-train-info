name: Daily crawl and private delivery

on:
  schedule:
    # 每天北京时间 07:20（即 UTC 前一天 23:20）
    - cron: "20 23 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "基准日期 YYYYMMDD（会在此基础上加 13 天），留空则以今天为基准"
        required: false
        type: string

permissions:
  # 上传失败时把交付 JSON 发成 Release，需要写权限
  contents: write

jobs:
  crawl-and-deliver:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download proxies.txt from latest release (optional)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +x
          if ! gh release download proxies-latest --repo "$GITHUB_REPOSITORY" --pattern "proxies.txt" --dir . 2>/dev/null; then
            echo "Own proxies-latest not found; trying upstream..."
            if ! gh release download proxies-latest --repo HerbertHe/cr-12306-train-info --pattern "proxies.txt" --dir . 2>/dev/null; then
              echo "No proxies.txt found. The crawler will connect directly."
            fi
          fi

      - name: Install dependencies
        run: npm install

      - name: Resolve target date
        id: target-date
        env:
          INPUT_DATE: ${{ inputs.target_date }}
        run: |
          set +x
          BASE=$(printf '%s' "$INPUT_DATE" | tr -d '[:space:]')
          if [ -z "$BASE" ]; then
            BASE=$(date -u +%Y%m%d)
            echo "未指定日期，基准取今天 $BASE"
          elif ! printf '%s' "$BASE" | grep -Eq '^[0-9]{4}-?[0-9]{2}-?[0-9]{2}$'; then
            echo "::error::target_date 非法：$INPUT_DATE，应为 YYYYMMDD"
            exit 1
          fi
          BASE=$(printf '%s' "$BASE" | tr -d '-')
          DATE=$(date -u -d "$BASE +13 days" +%Y%m%d)
          echo "基准日期 $BASE，抓取目标日期 $DATE"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Resolve config repository
        id: config-repo
        env:
          CONFIG_REPO: ${{ secrets.CONFIG_REPO }}
        run: |
          set +x
          CONFIG_REPO=$(printf '%s' "$CONFIG_REPO" | tr -d '[:space:]')
          if [ -z "$CONFIG_REPO" ]; then
            echo "::error::缺少 Secrets.CONFIG_REPO（格式 owner/repo）"
            exit 1
          fi
          echo "owner=${CONFIG_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "repo=${CONFIG_REPO##*/}" >> "$GITHUB_OUTPUT"

      # 用 GitHub App 原生方案换票：client-id 用 Variables.APP_CLIENT_ID，私钥用 Secrets.APP_PRIVATE_KEY
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.config-repo.outputs.owner }}
          repositories: ${{ steps.config-repo.outputs.repo }}

      # 抓取前先确认配置文件可读，避免跑完一小时才发现 404
      - name: Verify private config file
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CONFIG_REPO: ${{ secrets.CONFIG_REPO }}
        run: |
          set +x
          REPO=$(printf '%s' "$CONFIG_REPO" | tr -d '[:space:]')
          for CONFIG_FILE_PATH in config/upload.json upload.json; do
            if gh api "repos/$REPO/contents/$CONFIG_FILE_PATH" --jq '.name' >/dev/null 2>&1; then
              echo "配置可读：$REPO/$CONFIG_FILE_PATH"
              exit 0
            fi
          done
          echo "::error::$REPO 下找不到 config/upload.json 或 upload.json（HTTP 404）。请检查 CONFIG_REPO、文件路径，并确认 App 已安装到该仓且有 Contents: read"
          exit 1

      # 每组连跑 10 轮，整组失败后等 5 分钟再开下一组，直到成功
      - name: Run crawler
        env:
          # 历史 Release 仅作为增量基线回退读取
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 用 Action 换到的 installation token 读取私有仓配置，地址与 token 不进日志
          GITHUB_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          CONFIG_REPO: ${{ secrets.CONFIG_REPO }}
          CONFIG_PATH: config/upload.json
          SKIP_UPLOAD: "1"
          TARGET_DATE: ${{ steps.target-date.outputs.date }}
        run: |
          set +x
          BATCH=0
          while true; do
            BATCH=$((BATCH + 1))
            for ATTEMPT in $(seq 1 10); do
              echo "第 ${BATCH} 组，抓取尝试 ${ATTEMPT}/10"
              rm -rf dist
              if npm run dev; then
                exit 0
              fi
            done
            echo "第 ${BATCH} 组连续失败 10 轮，5 分钟后开始下一组"
            sleep 300
          done

      # 抓取可能持续超过 1 小时，App token 会过期，上传前重新换票
      - name: Refresh GitHub App token
        id: app-token-upload
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.config-repo.outputs.owner }}
          repositories: ${{ steps.config-repo.outputs.repo }}

      - name: Upload to private server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_APP_TOKEN: ${{ steps.app-token-upload.outputs.token }}
          CONFIG_REPO: ${{ secrets.CONFIG_REPO }}
          CONFIG_PATH: config/upload.json
          DELIVERY_DATE: ${{ steps.target-date.outputs.date }}
        run: |
          set +x
          npm run deliver

      # 上传失败时把交付 JSON 发成 Release，避免整轮重抓
      - name: Publish JSON to release on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_DATE: ${{ steps.target-date.outputs.date }}
        run: |
          set +x
          if [ ! -f "dist/train_list_${TARGET_DATE}.json" ] || [ ! -f "dist/train_detail_${TARGET_DATE}.json" ]; then
            echo "dist 不完整，跳过 Release"
            exit 0
          fi
          TAG="delivery-${TARGET_DATE}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Delivery ${TARGET_DATE}" \
              --notes "自动保存的交付 JSON，用于复用重跑" \
              --latest=false
          fi
          gh release upload "$TAG" \
            "dist/train_list_${TARGET_DATE}.json" \
            "dist/train_detail_${TARGET_DATE}.json" \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "已发布 Release $TAG"
